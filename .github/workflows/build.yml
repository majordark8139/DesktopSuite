name: Build & Package DesktopSuite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux Verification & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-gi python3-cairo python3-numpy gir1.2-gtk-3.0 libfontconfig1 fontconfig mpv

      - name: Run Headless Cairo Verification Test
        run: |
          python3 -m unittest discover tests

  build-windows:
    name: Compile Windows Portable Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Cache mpv Windows 7 Build
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mpv-win7.7z
          key: mpv-win7-x86_64-20230827-git-83c0e98

      - name: Download & Install Windows 7 Native mpv Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "assets\bin"
          $archivePath = "$env:RUNNER_TEMP\mpv-win7.7z"
          $minSize = 10000000
          $mirrors = @(
            "https://altushost-swe.dl.sourceforge.net/project/mpv-player-windows/64bit/mpv-x86_64-20230827-git-83c0e98.7z",
            "https://nchc.dl.sourceforge.net/project/mpv-player-windows/64bit/mpv-x86_64-20230827-git-83c0e98.7z",
            "https://phoenixnap.dl.sourceforge.net/project/mpv-player-windows/64bit/mpv-x86_64-20230827-git-83c0e98.7z",
            "https://downloads.sourceforge.net/project/mpv-player-windows/64bit/mpv-x86_64-20230827-git-83c0e98.7z",
            "https://master.dl.sourceforge.net/project/mpv-player-windows/64bit/mpv-x86_64-20230827-git-83c0e98.7z?viasf=1"
          )
          $cached = (Test-Path $archivePath) -and ((Get-Item $archivePath).Length -ge $minSize)
          if ($cached) {
            Write-Host "Using cached mpv archive ($([math]::Round((Get-Item $archivePath).Length/1MB,1)) MB)"
          } else {
            $downloaded = $false
            foreach ($url in $mirrors) {
              Write-Host "Trying mirror: $url"
              try {
                curl.exe --retry 3 --retry-delay 5 --max-time 120 -L $url -o $archivePath
              } catch {}
              if ((Test-Path $archivePath) -and ((Get-Item $archivePath).Length -ge $minSize)) {
                Write-Host "Downloaded successfully from: $url ($([math]::Round((Get-Item $archivePath).Length/1MB,1)) MB)"
                $downloaded = $true
                break
              }
              Write-Warning "Mirror failed or file too small, trying next..."
              if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
            }
            if (-not $downloaded) {
              throw "All mpv mirrors failed — cannot build portable package."
            }
          }
          Write-Host "Extracting Windows 7 mpv into assets\bin..."
          7z x $archivePath -o"assets\bin" -y
          if (Test-Path "assets\bin\mpv.exe") {
            Write-Host "Successfully installed Windows 7 compatible mpv.exe"
            Get-ChildItem "assets\bin" | Select-Object Name, Length
          } else {
            throw "assets\bin\mpv.exe was not found after extraction!"
          }

      - name: Run Headless Cairo Theme Verification on Windows
        run: |
          python -m unittest discover tests

      - name: Generate Multi-Resolution Windows Icon
        shell: powershell
        run: |
          python -c "from PIL import Image; img = Image.open('assets/icons/desktop-suite.png').convert('RGBA'); img.save('assets/icons/desktop-suite.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller DesktopSuite.spec

      - name: Prepare Windows Distribution Archive
        shell: powershell
        run: |
          $distDir = "dist\DesktopSuite"
          Copy-Item "assets" -Destination "$distDir\" -Recurse -Force
          if (Test-Path "assets\bin\api-ms-win-core-path-l1-1-0.dll") {
            Copy-Item "assets\bin\api-ms-win-core-path-l1-1-0.dll" -Destination "$distDir\" -Force
            if (Test-Path "$distDir\_internal") {
              Copy-Item "assets\bin\api-ms-win-core-path-l1-1-0.dll" -Destination "$distDir\_internal\" -Force
            }
            Write-Host "Bundled Windows 7 api-ms-win-core-path-l1-1-0.dll into portable root and _internal"
          }
          Copy-Item "Launch_DesktopSuite.bat" -Destination "$distDir\" -Force
          Copy-Item "README.md" -Destination "$distDir\" -Force
          Copy-Item "README_WINDOWS.md" -Destination "$distDir\" -Force
          Compress-Archive -Path "$distDir\*" -DestinationPath "DesktopSuite-Windows-Portable.zip" -Force
          Write-Host "Created DesktopSuite-Windows-Portable.zip successfully"

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSuite-Windows-Portable
          path: DesktopSuite-Windows-Portable.zip
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopSuite-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
