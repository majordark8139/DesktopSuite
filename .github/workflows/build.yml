name: Build & Package DesktopSuite

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux Verification & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-gi python3-cairo python3-numpy \
                              gir1.2-gtk-3.0 libfontconfig1 fontconfig mpv

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Cairo Verification Test
        run: |
          python3 -m unittest discover tests

  build-windows:
    name: Compile Windows Portable Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install mpv for Windows
        shell: powershell
        run: |
          choco install mpv -y --no-progress
          New-Item -ItemType Directory -Force -Path "assets\bin"
          $mpvBin = (Get-Command mpv.exe -ErrorAction SilentlyContinue).Source
          if (-not $mpvBin) {
            $mpvBin = "C:\tools\mpv\mpv.exe"
          }
          if (Test-Path $mpvBin) {
            Copy-Item $mpvBin -Destination "assets\bin\mpv.exe" -Force
            Write-Host "Bundled mpv.exe from $mpvBin"
          } else {
            Write-Warning "mpv.exe could not be found to bundle into assets\bin"
          }

      - name: Run Headless Cairo Theme Verification on Windows
        run: |
          python -m unittest discover tests

      - name: Compile Standalone Executable with PyInstaller
        run: |
          pyinstaller DesktopSuite.spec

      - name: Prepare Windows Distribution Archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release\DesktopSuite"
          Copy-Item "dist\DesktopSuite.exe" -Destination "release\DesktopSuite\" -Force
          Copy-Item "assets" -Destination "release\DesktopSuite\" -Recurse -Force
          Copy-Item "README.md" -Destination "release\DesktopSuite\" -Force
          Copy-Item "README_WINDOWS.md" -Destination "release\DesktopSuite\" -Force
          Compress-Archive -Path "release\DesktopSuite" -DestinationPath "DesktopSuite-Windows-Portable.zip" -Force
          Write-Host "Created DesktopSuite-Windows-Portable.zip successfully"

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopSuite-Windows-Portable
          path: DesktopSuite-Windows-Portable.zip
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DesktopSuite-Windows-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
